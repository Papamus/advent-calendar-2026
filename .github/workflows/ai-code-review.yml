name: AI Code Review Agent

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  review:
    name: AI Code Review (Security, UX & Correctness)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install dependencies
        if: hashFiles('package.json') != ''
        run: npm ci

      - name: Check TypeScript and dependency vulnerabilities
        if: hashFiles('package.json') != ''
        run: |
          npx next typegen
          npx tsc --noEmit
          npm audit --audit-level=high

      - name: Run deterministic Security & Quality Gate
        run: node .github/scripts/security-quality-gate.mjs

      - name: Test Security & Quality Gate
        run: node --test .github/scripts/security-quality-gate.test.mjs
