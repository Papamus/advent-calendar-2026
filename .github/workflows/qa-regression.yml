name: AI Continuous QA & Regression

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  qa-tests:
    name: Build & Playwright E2E Regression
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: "https://example.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "test-anon-key"
      SUPABASE_SERVICE_ROLE_KEY: "test-service-role-key"
      RESEND_API_KEY: "re_test_key"
      RESEND_FROM_EMAIL: "Advent Calendar <calendar@example.com>"
      ALLOWED_RECIPIENT_EMAIL: "test@example.com"
      AUTH_SECRET: "ci-test-auth-secret-minimum-32-chars-long"
      CRON_SECRET: "ci-test-cron-secret-minimum-32-chars-long"
      APP_URL: "http://localhost:3000"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check if app is initialized
        id: check_pkg
        run: |
          if [ -f "package.json" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        if: steps.check_pkg.outputs.exists == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        if: steps.check_pkg.outputs.exists == 'true'
        run: npm ci

      - name: Build application
        if: steps.check_pkg.outputs.exists == 'true'
        run: npm run build

      - name: Install Playwright Browsers & Run E2E Tests
        if: steps.check_pkg.outputs.exists == 'true'
        run: |
          if [ -d "tests" ]; then
            npx playwright install --with-deps chromium
            npx playwright test
          else
            echo "Brak katalogu tests — pomijam testy E2E w tym PR."
          fi